name: Soak

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/official/**"
      - "build.zig"
      - "build.zig.zon"
      - "mise.toml"
      - ".github/workflows/soak.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per soak case
        required: true
        type: number
        default: 1000
      timeout_seconds:
        description: Timeout per soak case
        required: true
        type: number
        default: 900
      streaming_mode:
        description: Streaming soak mode (smoke=10s, extended=600s)
        required: true
        type: choice
        options: [smoke, extended]
        default: extended
      streaming_seed:
        description: Deterministic streaming workload seed (1-9 decimal digits)
        required: true
        type: string
        default: "47"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    if: github.event_name != 'pull_request'
    name: Official unary soak (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOAK_ITERATIONS: ${{ inputs.iterations || '1000' }}
      SOAK_MAX_FAILURES: "0"
      SOAK_OVERALL_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '900' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.14

      - name: Install Protobuf C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev

      - name: Run official unary soak
        run: mise run interop-official

      - name: Upload soak logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-unary-soak
          path: .zig-cache/official/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  streaming-soak:
    name: Native cleartext streaming soak (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STREAMING_SOAK_MODE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.streaming_mode || 'extended' }}
      STREAMING_SOAK_SEED: ${{ inputs.streaming_seed || '47' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.7.14

      - name: Run streaming soak
        run: mise run soak-streaming

      - name: Upload streaming soak logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-cleartext-streaming-soak-x64
          path: |
            .zig-cache/official/streaming-soak/*.log
            .zig-cache/official/streaming-soak/resources*.json
            .zig-cache/official/streaming-soak/resources.jsonl
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
