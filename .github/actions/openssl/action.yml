name: Prepare OpenSSL
description: Build a pinned OpenSSL release for native TLS tests
inputs:
  series:
    description: OpenSSL series (3.5 or 4)
    default: '4'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        OPENSSL_SERIES: ${{ inputs.series }}
      run: |
        set -euo pipefail
        case "$OPENSSL_SERIES" in
          3.5) version=3.5.9; sha256=603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a ;;
          4) version=4.0.3; sha256=325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9 ;;
          *) exit 1 ;;
        esac
        prefix="$RUNNER_TEMP/openssl-$version"
        work=$(mktemp -d "$RUNNER_TEMP/build-openssl.XXXXXX")
        cd "$work"
        curl -fsSL --retry 3 -o source.tar.gz \
          "https://github.com/openssl/openssl/releases/download/openssl-$version/openssl-$version.tar.gz"
        echo "$sha256  source.tar.gz" | sha256sum -c -
        tar -xzf source.tar.gz
        cd "openssl-$version"
        ./Configure --prefix="$prefix" --libdir=lib shared no-tests
        make -j"$(nproc)" build_sw > "$work/build.log" || { tail -100 "$work/build.log"; exit 1; }
        make install_sw > "$work/install.log"
        echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
